<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AIVG 1.8.8 Demo — aritek t2v 协议复刻</title>
<style>
body{font-family:system-ui;background:#0f1115;color:#e6e6e6;max-width:860px;margin:40px auto;padding:0 20px}
input,textarea,button{background:#1c2029;color:#eee;border:1px solid #333a47;border-radius:6px;padding:8px;font-size:14px}
textarea{width:100%;height:80px}button{cursor:pointer;background:#2f6fed;border:0}
.card{background:#171a21;border:1px solid #262b36;border-radius:10px;padding:16px;margin:14px 0}
#log{font-family:monospace;font-size:12px;white-space:pre-wrap;background:#0b0d11;padding:12px;border-radius:8px;max-height:300px;overflow:auto}
</style>
</head>
<body>
<h2>🎬 AI Video Generator 1.8.8 — 协议复刻 Demo</h2>
<p style="color:#888">Sign=61ed377e…（AOSP testkey SHA1）· 端点复刻自 <code>/api/v3/video/t2v</code> 协议 · 本地 8911</p>
<div class="card">
  <textarea id="prompt">a cyberpunk cat riding a motorcycle through neon tokyo</textarea>
  <button onclick="gen()">生成视频 (POST /api/v3/video/t2v)</button>
  <button onclick="stats()">查看压测统计 (/stats)</button>
  <div id="log"></div>
</div>
<script>
const H={"Sign":"5f349d58ed069b1810d23b71c67293818784b57b","versionCode":"88","Content-Type":"application/json"};
const log=document.getElementById("log");
function p(s){log.textContent+=s+"\n";log.scrollTop=log.scrollHeight}
async function api(path,body,method="POST"){
  const r=await fetch(path,{method,headers:H,body:body?JSON.stringify(body):undefined});
  return {code:r.status,data:await r.json()};
}
async function gen(){
  log.textContent="";const prompt=document.getElementById("prompt").value;
  p("→ POST /api/v3/video/t2v");
  const c=await api("/api/v3/video/t2v",{prompt,versionCode:88});
  p("← "+JSON.stringify(c.data));
  const job=c.data.data.jobId;p("jobId="+job);
  for(let i=0;i<8;i++){
    await new Promise(r=>setTimeout(r,1000));
    const s=await api("/api/v1/generate/status",{jobId:job});
    p(`poll ${i+1}s: ${s.data.data.status} ${s.data.data.url||""}`);
    if(s.data.data.status==="done"){p("✅ 完成: "+s.data.data.url);return}
  }
}
async function stats(){
  const s=await api("/stats",null,"GET");
  log.textContent=JSON.stringify(s.data,null,2);
}
</script>
</body>
</html>
